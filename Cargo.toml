# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport"
description = "Xmip Transport capability: the direction-neutral Transport trait, its error vocabulary and the wire helpers every transport technology builds on."

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[features]
# The estate's TLS, for the technologies that guard a connection.
tls = ["dep:tls"]

# The loopback payloads every technology's tests drive (payload.rs). A
# technology asks for it from its dev-dependencies, so the fixtures reach
# its tests and never a production build (ADR-0044).
test-support = []

[dependencies]
# XML character data, escaped and unescaped as every reader in the estate
# does it.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# X.690, whose failures this crate's error takes with `From`, so a technology
# that frames with it (snmp, iec-61850) writes `?`. The technologies depend on
# the reader themselves; nothing re-exports it.
asn1 = { package = "xmip-core-library-asn1", git = "https://github.com/IlleNilsson/xmip-core-library-asn1", branch = "main" }
# TLS, for the one conversion a technology needs to write `?`: optional, so a
# build without it carries no TLS stack.
tls = { package = "xmip-core-library-tls", git = "https://github.com/IlleNilsson/xmip-core-library-tls", branch = "main", optional = true }
# The network primitives, whose failures this crate's error takes with `From`,
# so a technology that asks over HTTP (`net::http`) or reads a URL
# (`net::Endpoint`) writes `?`; and the target a SQL dialect reads
# (`net::Target`). The technologies depend on it themselves; nothing
# re-exports it.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# The readiness wait a bounded accept blocks on (socket.rs): poll(2), and
# WSAPoll on Windows, behind a safe call. Only its `event` module; std has
# no accept with a deadline, and the alternative was a nap and a retry.
rustix = { version = "1", default-features = false, features = ["std", "event"] }
# The settings declaration every technology writes (xcore::settings), read
# through by `Configured` (configured.rs): the one shape a transport's and a
# contract's settings share (ADR-0064, amendment 2026-09-26); and the failure
# the resilience guards judge, `xcore::Failure`, which this crate's error
# becomes by `From`, retryable as it was. The technologies depend on it
# themselves; nothing re-exports it.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[profile.dev.package."*"]
opt-level = 3
