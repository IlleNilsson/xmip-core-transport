# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport"
description = "Xmip Transport capability: the direction-neutral Transport trait, its error vocabulary and the wire helpers every transport technology builds on."

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. docs/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[dependencies]
# technology.rs and nothing else. Standard library otherwise, which is what
# makes this crate build on every target in deployment-model.md without a
# cross-compilation story. TLS went with the http technology on 2026-09-07,
# where the `tls` feature now lives.
serde = { version = "1", features = ["derive"] }
