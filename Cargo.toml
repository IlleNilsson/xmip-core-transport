# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport"
description = "Xmip Transport capability and its file, TCP, UDP, HTTP and SMTP implementations."

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. docs/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[features]
default = []

# HTTPS. Off by default because it is the only thing here that reaches outside
# the standard library, and a forwarder on an edge device should not carry a TLS
# stack it never opens.
#
# Declared, not implied. Four `cfg(feature = "tls")` guards referenced this
# feature while Cargo.toml did not declare it, which meant the HTTPS path could
# never compile in and the only thing saying so was a warning.
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pemfile"]

[dependencies]
# technology.rs and nothing else. Every protocol here is standard library only,
# which is what makes this crate build on every target in deployment-model.md
# without a cross-compilation story.
serde = { version = "1", features = ["derive"] }

# Optional, and only for `tls`.
# The ring feature, because http/tls.rs names that provider explicitly through
# builder_with_provider. Without it rustls 0.23 compiles only its default
# aws-lc-rs backend, rustls::crypto::ring does not exist, and the tls feature
# cannot build — which it never had, from the day it was written until
# 2026-08-30, because nothing built non-default features.
rustls = { version = "0.23", features = ["ring"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
# Reading certificate and key PEM for the server side. Only for `tls`.
rustls-pemfile = { version = "2", optional = true }

[dev-dependencies]
# Generating a self-signed certificate for the tls handshake tests. Test-only —
# it never ships in the crate.
rcgen = "0.13"
