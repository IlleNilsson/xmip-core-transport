# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport"
description = "Xmip Transport capability and its file, TCP, UDP, HTTP and SMTP implementations."

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "1", features = ["derive"] }
